function beat(t,x){if(!x){const nd=Math.round(TU('dbl')),hm=TU('hum');if(hm>0)t=Math.max(ctx.currentTime+0.01,t+(Math.random()-.5)*hm/1000);for(let k=1;k<=nd;k++)beat(t+k*TU('dgap')/1000,k)}const out=ctx.createStereoPanner?ctx.createStereoPanner():ctx.createGain();const J=S.tune.jit,rj=(k,e)=>1+(Math.random()-.5)*Math.min(1.5,J+(e||0))*k;T={p:S.tune.pitch*rj(.6,TU('jp')),l:S.tune.len*rj(.8,TU('jl')),b:2**(S.tune.tone*1.2),v:(1-Math.min(1.5,J+TU('jv'))*0.5*Math.random())*(1+0.5*TU('near'))*(x?Math.pow(.6,x):AC()),s:TU('soft')*0.03};if(out.pan)out.pan.value=S.pan?panV():0;if(TU('haas')>0){const sp=ctx.createChannelSplitter(2),mg=ctx.createChannelMerger(2),dl=ctx.createDelay(.05);dl.delayTime.value=TU('haas')/1000;out.connect(sp);sp.connect(mg,0,0);sp.connect(dl,1);dl.connect(mg,0,1);mg.connect(master)}else out.connect(master);const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.Q.value=TU('lpq');lp.frequency.value=Math.max(800,20000*(1-TU('warm')*0.93)**2);lp.connect(out);if(TU('rev')>0){const w=ctx.createGain();w.gain.value=TU('rev')*(1-.7*TU('near'));out.connect(w);w.connect(rev())}if(TU('echo')>0){const E=echo(),g=ctx.createGain();E.d.delayTime.value=TU('etime');E.f.gain.value=Math.min(.85,TU('efb'));g.gain.value=TU('echo');out.connect(g);g.connect(E.i)}const e1=ctx.createBiquadFilter(),e2=ctx.createBiquadFilter();e1.type='lowshelf';e1.frequency.value=200;e1.gain.value=TU('bass')+6*TU('near');e2.type='highshelf';e2.frequency.value=4000;e2.gain.value=TU('treb');const hf=ctx.createBiquadFilter();hf.type='highpass';hf.frequency.value=TU('hp');e1.connect(e2);e2.connect(hf);hf.connect(lp);SUB(out,t);const id=S.sound;if(BUILT[id])BUILT[id][1](e1,t);else if(cbuf[id]){const s=ctx.createBufferSource();const rr=SN.find(x=>x.id==id)||{},bd=cbuf[id].duration,st=Math.min(rr.st||0,Math.max(0,bd-0.05));s.buffer=cbuf[id];s.playbackRate.value=T.p;s.connect(e1);s.start(t,st,Math.min((rr.ln||1.5)*T.l,bd-st))}}

function vPhoto(){return `<label class="big">＋ 写真を追加<input type="file" accept="image/*" multiple class="fi" id="fp"></label><p class="m">${P.length}枚（この端末のブラウザ内に保存。外部には送信されません）</p><div class="grid">${P.map((p,pi)=>`<div class="ph"><div class="m" style="margin:0 0 4px">#${pi+1}</div><img src="${p.url}" alt=""><select data-p="${p.id}" data-k="grp">${G.map(g=>`<option value="${g}" ${p.grp==g?'selected':''}>${g?'グループ '+g:'グループなし'}</option>`).join('')}</select><select data-p="${p.id}" data-k="instr"><option value="">指示：ランダム</option><option value="-" ${p.instr=='-'?'selected':''}>指示：なし</option>${S.instr.map(x=>`<option value="${x.id}" ${p.instr==x.id?'selected':''}>${esc(x.t)}</option>`).join('')}</select><button class="x" data-a="delp" data-id="${p.id}">削除</button></div>`).join('')}</div>`}
function vInstr(){return `<h3>指示リスト</h3><p class="m">チェックを外すとランダムの対象から外れます（写真ごとの固定指定は有効）。</p>${S.instr.map(x=>`<div class="row"><input type="checkbox" data-i="${x.id}" data-k="on" ${x.on?'checked':''}><input type="text" data-i="${x.id}" data-k="t" value="${esc(x.t)}"><button data-a="deli" data-id="${x.id}">✕</button></div>${vrow(x)}`).join('')}<div class="row"><input type="text" id="ni" placeholder="新しい指示"><button data-a="addi">追加</button></div>
<h3>初期値の指示（最初・最後・休憩）</h3><p class="m">ラウンドごとの指示は「ラウンド」タブで個別に変えられます。ラウンド側に入力がある場合は、そちらが優先されます。</p><div class="m" style="margin:12px 0 4px;color:var(--ac)">最初の指示（初期値）</div><div class="f2"><input type="text" data-f="first" data-k="t" value="${esc(S.first.t)}" placeholder="空欄で無効"><div><label>表示秒数</label><input type="number" min="0" data-f="first" data-k="sec" value="${S.first.sec}"></div></div>
<div class="m" style="margin:12px 0 4px;color:var(--ac)">最後の指示（初期値）</div><div class="f2"><input type="text" data-f="last" data-k="t" value="${esc(S.last.t)}" placeholder="空欄で無効"><div><label>終了前の秒数</label><input type="number" min="0" data-f="last" data-k="sec" value="${S.last.sec}"></div></div><div class="m" style="margin:12px 0 4px;color:var(--ac)">休憩中の指示（初期値）</div><input type="text" data-s="restT" value="${esc(S.restT)}"><p class="m">「/」で区切るとランダム。ラウンドごとの設定は「ラウンド」タブで。</p><button class="big" style="width:100%;border:0;margin-top:8px" data-a="rstr">各ラウンドの個別設定を消して、この初期値にそろえる</button>${vCm()}${vTts()}`}
function vSound(){const rows=Object.keys(BUILT).map(k=>[k,BUILT[k][0],0]).concat(SN.filter(s=>!s.v&&!s.b).map(s=>[s.id,s.name,1]));return `<h3>BPMの音を選ぶ</h3><p class="m">拍ごとに鳴る音を選びます。左右の位置はランダムに動かせます。</p>${rows.map(([id,n,c])=>`<div class="row card"><input type="radio" name="snd" value="${id}" ${S.sound==id?'checked':''}><span style="flex:1">${esc(n)}</span><button data-a="test" data-id="${id}">▶</button>${c?`<button data-a="dels" data-id="${id}">✕</button>`:''}${c?(r=>`<div style="flex-basis:100%;display:flex;gap:8px"><label class="m" style="flex:1">開始（秒）<input type="number" step="0.1" min="0" data-sn="${id}" data-k="st" value="${r.st||0}"></label><label class="m" style="flex:1">長さ（秒）<input type="number" step="0.1" min="0.1" data-sn="${id}" data-k="ln" value="${r.ln||1.5}"></label></div>`)(SN.find(x=>x.id==id)||{}):''}</div>`).join('')}<label class="big" style="margin-top:10px">＋ 音源／動画を追加<input type="file" accept="audio/*,video/*" multiple class="fi" id="fs"></label><p class="m">動画や音声ファイルから音声だけを取り出して保存します（先頭30秒まで）。追加後に「開始」と「長さ」で、鳴らす部分を選べます。</p><h3>音の調整</h3><div class="m">エフェクトのおすすめ設定（押すとスライダーが変わります）</div><div class="row" style="flex-wrap:wrap"><button data-a="fxp" data-id="0">ドライ</button><button data-a="fxp" data-id="1">耳元（近く）</button><button data-a="fxp" data-id="2">ホール（広い）</button><button data-a="fxp" data-id="3">ゆったり</button><button data-a="fxp" data-id="4">二重のドクドク</button><button data-a="fxp" data-id="5">耳元ささやき</button><button data-a="fxp" data-id="6">ラジオ風</button><button data-a="fxp" data-id="7">水の中</button><button data-a="fxp" data-id="8">夢の中</button><button data-a="fxp" data-id="9">重低音ドーン</button><button data-a="fxp" data-id="10">地鳴り（超重低音）</button><button data-a="fxp" data-id="11">胸が震える</button><button data-a="fxr">設定をリセット</button></div><button class="big" style="width:100%;border:0" data-a="test" data-id="${S.sound}">▶ いまの設定で試し聴き</button>${tsl([['pitch','高さ',0.25,2,0.05],['len','長さ',0.4,3,0.05],['spread','左右の広がり',0,1,0.05],['jit','ランダムなゆらぎ',0,1,0.05],['jp','音程のゆらぎ（追加）',0,1,0.05],['jv','音量のゆらぎ（追加）',0,1,0.05],['jl','長さのゆらぎ（追加）',0,1,0.05]])}<h3>重低音</h3>${tsl([['sub','サブベースの量',0,1.5,0.05],['subf','サブベースの高さ（Hz）',25,120,1],['subl','サブベースの長さ（ミリ秒）',60,1200,10],['subd','キックのような落ち（深さ）',0,1,0.05],['subs','倍音を足してスマホでも聞こえやすくする',0,1,0.05]])}<div class="row"><input type="checkbox" data-t="lim" id="lim" ${TU('lim')?'checked':''}><label for="lim">音割れ防止（リミッター）</label></div><p class="m">スマートフォンの小さなスピーカーでは、とても低い音はほとんど出ません。重低音は、イヤホンやヘッドホン、低音の出るスピーカーで体感できます。「倍音を足す」を上げると、スマホのスピーカーでも低音の存在が感じやすくなります。大きな音で長く聞くと、耳や体に負担がかかります。音量は小さめから上げてください。</p><h3>音色（イコライザー）</h3>${tsl([['tone','明るさ（左：こもる／右：シャリ）',-1,1,0.05],['bass','低音（dB）',-12,18,1],['treb','高音（dB）',-12,12,1],['hp','ローカット（低音を削る・Hz）',20,1500,10],['warm','まろやかさ（高音をカット）',0,1,0.05],['lpq','フィルターのクセ（レゾナンス）',0.5,8,0.1],['soft','やわらかさ（立ち上がり）',0,1,0.05]])}<h3>空間と響き</h3>${tsl([['rev','空間の響き（リバーブ）',0,1,0.05],['rsz','リバーブの長さ（秒）',0.3,4,0.1],['rdm','リバーブの高音の減衰',0,1,0.05],['rpd','リバーブの始まりの遅れ（ミリ秒）',0,120,5],['echo','エコー（量）',0,0.8,0.05],['etime','エコーの間隔（秒）',0.05,0.8,0.01],['efb','エコーの繰り返し',0,0.8,0.05],['haas','ステレオの広がり（ミリ秒）',0,25,1],['near','近さ（耳に近い感じ）',0,1,0.05]])}<h3>リズムの味付け</h3>${tsl([['acc','アクセント（N拍ごとに強く／0=なし）',0,8,1],['dbl','連打の追加回数',0,3,1],['dgap','連打の間隔（ミリ秒）',20,200,5],['hum','タイミングのゆらぎ（ミリ秒）',0,60,1]])}<h3>音量</h3><input type="range" id="vol" min="0.05" max="1" step="0.05" value="${S.vol}" style="width:100%"><div class="row"><input type="checkbox" id="pan" ${S.pan?'checked':''}><label for="pan">左右にランダムに振る</label></div><div class="m">左右の動き方</div><select data-t="panm">${['ランダム','左右交互','中央に固定','ゆっくり往復'].map((n,i)=>`<option value="${i}" ${TU('panm')==i?'selected':''}>${n}</option>`).join('')}</select>${vBgm()}`}
function vRound(){const tot=S.rounds.reduce((a,r,i)=>a+r.sec+(i<S.rounds.length-1?r.rest:0),0);return `<p class="m">合計 ${Math.floor(tot/60)}分${tot%60}秒</p>${S.rounds.map((r,i)=>`<details class="rd" data-ok="r${i}"${i==0?' open':''}><summary><b>ラウンド ${i+1}</b><span class="rs">${r.sec}秒 / BPM ${r.min}-${r.max}</span></summary><details class="sub" data-ok="r${i}a" open><summary>時間・写真・BPM</summary><div class="f2"><div><label>ラウンド時間（秒）</label><input type="number" min="1" data-r="${i}" data-k="sec" value="${r.sec}"></div><div><label>写真が変わる間隔（秒）</label><input type="number" min="1" data-r="${i}" data-k="photo" value="${r.photo}"></div><div><label>ランダム間隔 最短（0=固定）</label><input type="number" min="0" data-r="${i}" data-k="pmin" value="${r.pmin||''}" placeholder="0"></div><div><label>ランダム間隔 最長（秒）</label><input type="number" min="0" data-r="${i}" data-k="pmax" value="${r.pmax||''}" placeholder="0"></div><div><label>BPM 最小</label><input type="number" min="20" data-r="${i}" data-k="min" value="${r.min}"></div><div><label>BPM 最大</label><input type="number" min="20" data-r="${i}" data-k="max" value="${r.max}"></div><div><label>使う写真グループ</label><select data-r="${i}" data-k="grp"><option value="*">全て</option>${G.slice(1).map(g=>`<option value="${g}" ${r.grp==g?'selected':''}>${g}</option>`).join('')}</select></div><div><label>この後の休憩（秒）</label><input type="number" min="0" data-r="${i}" data-k="rest" value="${r.rest}"></div></div></details><details class="sub" data-ok="r${i}b"><summary>指示・説明・文字の見た目</summary><div class="f2" style="margin-top:8px"><div><label>最初の指示（空欄＝共通、「-」＝出さない）</label><input type="text" data-r="${i}" data-k="ft" value="${esc(r.ft||'')}" placeholder="共通：${esc(S.first.t)}"></div><div><label>表示秒数</label><input type="number" min="0" data-r="${i}" data-k="fsec" value="${r.fsec||''}" placeholder="共通：${S.first.sec}"></div><div><label>最後の指示（空欄＝共通、「-」＝出さない）</label><input type="text" data-r="${i}" data-k="lt" value="${esc(r.lt||'')}" placeholder="共通：${esc(S.last.t)}"></div><div><label>終了前の秒数</label><input type="number" min="0" data-r="${i}" data-k="lsec" value="${r.lsec||''}" placeholder="共通：${S.last.sec}"></div></div><div style="margin-top:8px"><div class="m" style="margin:0">休憩中の指示（「/」で区切るとランダム）</div><input type="text" data-r="${i}" data-k="rtx" value="${esc(r.rtx||'')}" placeholder="共通：${esc(S.restT)}"></div><div class="m" style="margin:10px 0 0">ラウンド開始前の説明（空欄＝なし）</div><div class="f2"><input type="text" data-r="${i}" data-k="itx" value="${esc(r.itx||'')}"><div><label>表示秒数</label><input type="number" min="0" data-r="${i}" data-k="isec" value="${r.isec||''}" placeholder="5"></div></div><div class="m" style="margin:10px 0 0">指示を出す位置</div><div class="f2">${[['pos','通常の指示','86'],['fpos','最初の指示','86'],['lpos','最後の指示','86'],['rpos','休憩中の指示','50']].map(([k,n,d])=>`<div><label>${n}</label><select data-r="${i}" data-k="${k}">${POS.map(([v,nm])=>`<option value="${v}" ${(r[k]||d)==v?'selected':''}>${nm}</option>`).join('')}</select></div>`).join('')}</div><div class="m" style="margin:10px 0 0">指示の文字（「共通」＝「設定」タブと同じ）</div><div class="f2"><div><label>フォント</label><select data-r="${i}" data-k="tpf"><option value="">共通</option>${Object.keys(FONTS).map(k=>`<option value="${k}" ${r.tpf==k?'selected':''}>${FONTS[k][0]}</option>`).join('')}</select></div><div><label>文字の色</label><select data-r="${i}" data-k="tpc"><option value="">共通</option>${CMP.map(([v,n])=>`<option value="${v}" ${r.tpc==v?'selected':''}>${n}</option>`).join('')}</select></div><div><label>文字サイズ（0=共通）</label><input type="number" min="0" max="80" data-r="${i}" data-k="tps" value="${r.tps||''}" placeholder="0"></div></div></details><details class="sub" data-ok="r${i}c"><summary>休憩の画像</summary><div style="margin-top:8px"><div class="m" style="margin:0">休憩中の画像（ランダムのときは写真の切り替え間隔で変わります）</div><select data-r="${i}" data-k="rimg"><option value="">なし（紫の画面）</option><option value="*" ${r.rimg=='*'?'selected':''}>全写真からランダム</option>${G.slice(1).map(g=>`<option value="${g}" ${r.rimg==g?'selected':''}>グループ${g}からランダム</option>`).join('')}${P.map((p,n)=>`<option value="p:${p.id}" ${r.rimg=='p:'+p.id?'selected':''}>#${n+1}を固定</option>`).join('')}</select><div class="f2" style="margin-top:6px"><div><label>休憩写真の間隔 最短（秒）</label><input type="number" min="0" data-r="${i}" data-k="rpmin" value="${r.rpmin||''}" placeholder="0＝標準"></div><div><label>最長（秒）</label><input type="number" min="0" data-r="${i}" data-k="rpmax" value="${r.rpmax||''}" placeholder="0＝標準"></div></div><div class="m" style="margin:4px 0 0">最短と最長を入れると、休憩中の写真がその範囲のランダムな間隔で変わります。</div></div></details><details class="sub" data-ok="r${i}d"><summary>BGM（このラウンド）</summary><div class="m" style="margin:10px 0 0">このラウンドのBGM（「音」タブでBGMをオンにしてください）</div><div class="f2"><div><label>曲</label><select data-r="${i}" data-k="bgm"><option value="">共通（チェックした曲）</option><option value="none" ${r.bgm=='none'?'selected':''}>流さない</option>${SN.filter(s=>s.b).map(s=>`<option value="${s.id}" ${r.bgm==s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div><label>BGM音量（0=共通）</label><input type="number" min="0" max="1" step="0.05" data-r="${i}" data-k="bvol" value="${r.bvol||''}" placeholder="0"></div></div></details>${S.rounds.length>1?`<button class="x" data-a="delr" data-id="${i}">このラウンドを削除</button>`:''}</details>`).join('')}<button class="big" style="width:100%;border:0" data-a="addr">＋ ラウンドを追加</button>`}
function render(){applyLook();applyTheme();rbar();$('#tabs').innerHTML=['写真','ラウンド','指示','音','設定'].map((n,i)=>`<button class="${i==tab?'on':''}" data-a="tab" data-id="${i}">${n}</button>`).join('');$('#app').innerHTML=[vPhoto,vRound,vInstr,vSound,vLook][tab]();groupSections();decorateRanges()}
/* events */
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;
if(d.p){const p=P.find(x=>x.id==d.p);if(p){p[d.k]=t.value;putP(p)}return}
if(d.i){const x=S.instr.find(x=>x.id==d.i);if(x)x[d.k]=d.k=='on'?t.checked:t.value}
else if(d.f)S[d.f][d.k]=d.k=='sec'?+t.value:t.value;
else if(d.r!=null){const r=S.rounds[d.r];r[d.k]=(d.k=='grp'||d.k=='itx'||d.k=='ft'||d.k=='lt'||d.k=='rtx'||d.k=='rimg'||d.k=='tpf'||d.k=='tpc'||d.k=='bgm'||/pos$/.test(d.k))?t.value:Math.max(0,+t.value)}
else if(d.l){S.look[d.l]=t.type=='checkbox'?t.checked:(d.l=='fs'||d.l=='ps')?+t.value:t.value;applyLook()}else if(d.ui){S.ui=S.ui||{};S.ui[d.ui]=t.type=='checkbox'?(t.checked?1:0):t.tagName=='SELECT'?t.value:+t.value}else if(d.br){S.br=S.br||{};S.br[d.br]=t.type=='checkbox'?(t.checked?1:0):t.type=='number'?Math.max(0,+t.value||0):t.value}else if(d.x){S.fx=S.fx||{};S.fx[d.x]=t.type=='checkbox'?(t.checked?1:0):t.type=='range'?+t.value:t.value}else if(d.th){S.theme=S.theme||{id:'pink'};S.theme.o=S.theme.o||{};S.theme.o[d.th]=t.value;applyTheme()}else if(d.b){S.bgm[d.b]=t.type=='checkbox'?t.checked:t.type=='range'?+t.value:t.value;if(bgG)bgG.gain.value=S.bgm.vol}else if(d.bo){const o=S.bgm.off=S.bgm.off||[],i=o.indexOf(d.bo);if(t.checked){if(i>=0)o.splice(i,1)}else if(i<0)o.push(d.bo)}else if(d.pf){const p=(S.tts.prof||[]).find(x=>x.id==d.pf);if(p)p[d.k]=t.type=='range'?+t.value:t.value}else if(d.mp){S.tts.map=S.tts.map||{};S.tts.map[d.mp]=t.value}else if(d.y){S.tts[d.y]=t.type=='checkbox'?t.checked:t.type=='range'?+t.value:t.value}else if(d.pn){const x=PR.list.find(x=>x.id==d.pn);if(x){x.name=t.value;rbar()}}else if(d.sn){const r=SN.find(x=>x.id==d.sn);if(r){r[d.k]=+t.value;tx('snd','readwrite',s=>s.put(r))}}else if(d.s)S[d.s]=t.value;else if(d.ci!=null)S.cm.list[d.ci]=t.value;else if(d.c)S.cm[d.c]=t.type=='checkbox'?t.checked:t.type=='range'?+t.value:t.value;else if(d.t)S.tune[d.t]=t.type=='checkbox'?(t.checked?1:0):+t.value;else if(t.name=='snd')S.sound=t.value;
else if(t.id=='vol'){S.vol=+t.value;if(master)master.gain.value=S.vol}
else if(t.id=='pan')S.pan=t.checked;
else return;save()});
document.addEventListener('change',async e=>{const t=e.target;if(t.id=='presel')usePre(t.value);
